[package]
name = "roxtract"
description = "Inspect and extract from RISC OS ROM images"
repository = "https://github.com/pearfalse/roxtract"
license = "BSD-3-Clause"
version.workspace = true
edition.workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"


[workspace.dependencies]
ascii = "1.1"

[dependencies]
crc-any = { version = "2.5", optional = true }
ascii = { workspace = true }

[features]
default = ["crc"]
crc = ["dep:crc-any"]

[dev-dependencies]
sptr = "0.3.2"
assert_hex = "0.4.1"
